###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
database.ip = ${DB_IP:localhost}
database.port = ${DB_PORT:5432}
database.user = ${DB_USER:postgres}
database.password = ${DB_PASSWORD:postgres_the_superuser}

# 1. Monitoring DataSource
app.datasource.monitoring.jdbc-url = jdbc:postgresql://${database.ip}:${database.port}/monitoring_db
app.datasource.monitoring.username = ${database.user}
app.datasource.monitoring.password = ${database.password}
app.datasource.monitoring.driver-class-name = org.postgresql.Driver

# 2. Auth DataSource
app.datasource.auth.jdbc-url = jdbc:postgresql://${database.ip}:${database.port}/auth_db
app.datasource.auth.username = ${database.user}
app.datasource.auth.password = ${database.password}
app.datasource.auth.driver-class-name = org.postgresql.Driver

# 3. User DataSource
app.datasource.user.jdbc-url = jdbc:postgresql://${database.ip}:${database.port}/user_db
app.datasource.user.username = ${database.user}
app.datasource.user.password = ${database.password}
app.datasource.user.driver-class-name = org.postgresql.Driver

# 4. Device DataSource
app.datasource.device.jdbc-url = jdbc:postgresql://${database.ip}:${database.port}/device_db
app.datasource.device.username = ${database.user}
app.datasource.device.password = ${database.password}
app.datasource.device.driver-class-name = org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view = false
spring.jpa.show-sql = true

server.tomcat.threads.max = 1

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root = INFO
logging.level.org.springframework = INFO
logging.level.ro.tuc = DEBUG

###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port = ${PORT:8080}